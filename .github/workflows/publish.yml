name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  # run the same typecheck + test matrix as test.yml against the tagged commit
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
    secrets: inherit # CODECOV_TOKEN for the coverage upload step

  publish:
    # never upload a release that hasn't passed the test suite
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - run: pip install build

      - run: python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
